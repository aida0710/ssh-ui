openapi: 3.1.0
info:
  title: SSH UI Local API
  version: 0.1.0
paths:
  /api/v1/session/bootstrap:
    post:
      operationId: bootstrapSession
      parameters:
        - name: X-SSH-UI-Bootstrap
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Session established
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Authenticated process health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/actions:
    post:
      operationId: issueActionToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueActionRequest" }
      responses:
        "201":
          description: One-time action token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueActionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/config:
    post:
      operationId: checkConfiguration
      responses:
        "200":
          description: Syntax and Include graph check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheckResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/effective:
    post:
      operationId: inspectEffectiveConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Effective configuration, provenance and jump route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/reachability:
    post:
      operationId: checkReachability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Direct TCP reachability, ignoring ProxyJump
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/authentication:
    post:
      operationId: testAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthenticationRequest" }
      responses:
        "200":
          description: Completed authentication test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/remote-keys/plan:
    post:
      operationId: planRemoteKeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteKeyPlanRequest" }
      responses:
        "200":
          description: What the registration would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteKeyPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/remote-keys/register:
    post:
      operationId: registerRemoteKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteKeyRegisterRequest" }
      responses:
        "200":
          description: Completed registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteKeyRegisterResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts:
    get:
      operationId: listKnownHosts
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Matching known_hosts entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/delete:
    post:
      operationId: deleteKnownHosts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsDeleteRequest" }
      responses:
        "200":
          description: Entries removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsChangeResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/scan:
    post:
      operationId: scanKnownHosts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsScanRequest" }
      responses:
        "200":
          description: Unverified candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsScanResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/add:
    post:
      operationId: addKnownHost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsAddRequest" }
      responses:
        "200":
          description: Entry added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsChangeResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/command:
    post:
      operationId: getTerminalCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Command text and whether it may be launched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalCommandResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/launch:
    post:
      operationId: launchTerminal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Terminal opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalLaunchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/sync:
    get:
      operationId: getSyncStatus
      responses:
        "200":
          description: Whether a bucket is configured and what was last synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/settings:
    put:
      operationId: configureSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncSettingsRequest" }
      responses:
        "200":
          description: Bucket configured for this run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/push:
    post:
      operationId: pushSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassphraseRequest" }
      responses:
        "200":
          description: Snapshot written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/pull:
    post:
      operationId: pullSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PullRequest" }
      responses:
        "200":
          description: What applying the snapshot would change, or what it applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords:
    get:
      operationId: getPasswordVault
      responses:
        "200":
          description: Whether a vault exists, whether it is unlocked, and which hosts have a password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords/initialise:
    post:
      operationId: initialisePasswordVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassphraseRequest" }
      responses:
        "200":
          description: Vault created and unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords/unlock:
    post:
      operationId: unlockPasswordVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassphraseRequest" }
      responses:
        "200":
          description: Vault unlocked for this run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords/lock:
    post:
      operationId: lockPasswordVault
      responses:
        "200":
          description: Derived key and every pending askpass token forgotten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords/{alias}/eligibility:
    get:
      operationId: getPasswordEligibility
      # Read-only, and deliberately so: everything it reports is answerable
      # from the files this application already parses. A check that opened a
      # connection to decide whether a password may be stored would be a
      # connection the user did not ask for.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: What stands between this host and a stored password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordEligibility" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/passwords/{alias}:
    put:
      operationId: storePassword
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorePasswordRequest" }
      responses:
        "200":
          description: Password stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: forgetPassword
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Password forgotten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordVaultStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/keys:
    get:
      operationId: listKeys
      responses:
        "200":
          description: Classified contents of the ssh workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyInventoryResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    post:
      operationId: generateKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateKeyRequest" }
      responses:
        "201":
          description: Key pair generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateKeyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/algorithms:
    get:
      operationId: listKeyAlgorithms
      responses:
        "200":
          description: Variants the installed OpenSSH supports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyAlgorithmsResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/hardware-command:
    post:
      operationId: buildHardwareKeyCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HardwareCommandRequest" }
      responses:
        "200":
          description: Command the user runs in Terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HardwareCommandResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/passphrase:
    post:
      operationId: changeKeyPassphrase
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassphraseRequest" }
      responses:
        "200":
          description: Passphrase changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePassphraseResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/reveal:
    post:
      operationId: revealPrivateKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
        - name: X-SSH-UI-Action
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Private key material, never cached and never logged
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevealPrivateKeyResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/public:
    get:
      operationId: readPublicKey
      description: >-
        Returns the text of one public key or certificate file. A public key is
        not a secret, so this needs no confirmation token and is not separated
        from the ordinary detail API the way reveal is. It refuses any entry
        that is not a public key or a certificate, so it can never be used to
        read private key material.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Public key text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKeyResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/config/groups/rename:
    post:
      operationId: renameGroup
      description: >-
        Renames a group directory and everything that names it — every
        connection file under connections/<old>, every key under keys/<old>,
        every IdentityFile pointing into it, the generated Include region, the
        compiled settings file and metadata.json — in one journalled
        transaction. Nested groups travel with their parent. The emptied source
        directory is reported and is not removed: storage moves files, not
        directories.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRenameRequest" }
      responses:
        "200":
          description: Group renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/config/groups/delete:
    post:
      operationId: deleteGroup
      description: >-
        Removes a group's declaration and relocates its connections and keys
        into another group, or to the connections directory itself. No
        configuration file is ever deleted by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupDeleteRequest" }
      responses:
        "200":
          description: Group removed and its connections relocated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/location:
    post:
      operationId: relocateKey
      description: >-
        Changes a key's name, its group, or both, and rewrites every
        configuration directive that names it, in one transaction committed
        through the configuration engine so the rewritten files are re-parsed
        and re-resolved before anything lands. An absent field is left as it is;
        an empty group moves the key to the root of ~/.ssh. It refuses rather
        than guesses: a directive whose path cannot be resolved, one in a file
        outside the workspace, a destination an Include glob would read as
        configuration, or a group nothing declares each block the whole
        transaction and are reported as blockers.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelocateKeyRequest" }
      responses:
        "200":
          description: Key relocated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelocateKeyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: The relocation was blocked, and nothing was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelocateKeyResponse" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/agent:
    post:
      operationId: registerKeyWithAgent
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterKeyRequest" }
      responses:
        "200":
          description: Key registered with the ssh-agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterKeyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/trash:
    post:
      operationId: trashKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Key moved to the trash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashKeyResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/trash:
    get:
      operationId: listTrash
      responses:
        "200":
          description: Soft-deleted keys, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashListResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/trash/{entryId}/restore:
    post:
      operationId: restoreTrashEntry
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Trash entry restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreTrashResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: Restore refused because it would have to guess
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreTrashResponse" }
  /api/v1/trash/{entryId}:
    delete:
      operationId: purgeTrashEntry
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: X-SSH-UI-Action
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Trash entry permanently deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeTrashResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/config/overview:
    get:
      operationId: getConfigOverview
      responses:
        "200":
          description: Include tree, hosts, groups and diagnostics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/config/host:
    get:
      operationId: getConfigHost
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: alias
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: One host block with its explained values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/config/file:
    get:
      operationId: getConfigFile
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: One configuration file for the raw editor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContents" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/config/preview:
    post:
      operationId: previewConfigEdit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditRequest" }
      responses:
        "200":
          description: Exactly what a save would write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavePreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/config/save:
    post:
      operationId: saveConfigEdit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditRequest" }
      responses:
        "200":
          description: Committed transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/metadata:
    get:
      operationId: getMetadata
      responses:
        "200":
          description: UI-only organisation data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metadata" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/history:
    get:
      operationId: getHistory
      responses:
        "200":
          description: Completed transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryList" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/history/restore:
    post:
      operationId: restoreHistoryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: Restored file committed as a new transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/history/recover:
    post:
      operationId: recoverTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverRequest" }
      responses:
        "200":
          description: Interrupted transaction completed or rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoverResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 43, maxLength: 43 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string, minLength: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: string }
        path: { type: string }
        line: { type: integer }
        column: { type: integer }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        conflict: { $ref: "#/components/schemas/ConflictReport" }
    KeyReference:
      type: object
      additionalProperties: false
      required: [directive, configPath, line, condition, hostPatterns, value]
      properties:
        directive: { type: string }
        configPath: { type: string }
        line: { type: integer }
        condition: { type: string }
        hostPatterns: { type: array, items: { type: string } }
        value: { type: string }
    UnresolvedReference:
      type: object
      additionalProperties: false
      required: [directive, value, configPath, line, reason]
      properties:
        directive: { type: string }
        value: { type: string }
        configPath: { type: string }
        line: { type: integer }
        reason: { type: string }
    KeyCertificate:
      type: object
      additionalProperties: false
      required: [keyId, principals, validBefore, neverExpires, signedKeyType, signedKeyFingerprint]
      properties:
        keyId: { type: string }
        principals: { type: array, items: { type: string } }
        validBefore: { type: integer }
        neverExpires: { type: boolean }
        signedKeyType: { type: string }
        signedKeyFingerprint: { type: string }
    UnreadableFile:
      type: object
      additionalProperties: false
      required: [relativePath, reason]
      properties:
        relativePath: { type: string }
        reason: { type: string }
    KeyItem:
      type: object
      additionalProperties: false
      required:
        [id, relativePath, kind, container, algorithm, keyType, bits, encrypted,
         fingerprint, comment, permission, permissionRisk, sizeBytes, references, notes]
      properties:
        id: { type: string }
        relativePath: { type: string }
        kind: { type: string }
        container: { type: string }
        algorithm: { type: string }
        keyType: { type: string }
        bits: { type: integer }
        encrypted: { type: boolean }
        fingerprint: { type: string }
        comment: { type: string }
        permission: { type: string }
        permissionRisk: { type: boolean }
        sizeBytes: { type: integer }
        certificate: { $ref: "#/components/schemas/KeyCertificate" }
        references: { type: array, items: { $ref: "#/components/schemas/KeyReference" } }
        notes: { type: array, items: { type: string } }
    AgentIdentity:
      type: object
      additionalProperties: false
      required: [bits, fingerprint, comment, algorithm]
      properties:
        bits: { type: integer }
        fingerprint: { type: string }
        comment: { type: string }
        algorithm: { type: string }
    KeyInventoryResponse:
      type: object
      additionalProperties: false
      required: [items, unreadable, agentDelegations, unresolvedReferences, agentAvailable, agentIdentities]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KeyItem" } }
        unreadable: { type: array, items: { $ref: "#/components/schemas/UnreadableFile" } }
        agentDelegations: { type: array, items: { $ref: "#/components/schemas/KeyReference" } }
        unresolvedReferences: { type: array, items: { $ref: "#/components/schemas/UnresolvedReference" } }
        agentAvailable: { type: boolean }
        agentIdentities: { type: array, items: { $ref: "#/components/schemas/AgentIdentity" } }
    KeyVariant:
      type: object
      additionalProperties: false
      required: [algorithm, bits, label, inProcess, reason]
      properties:
        algorithm: { type: string }
        bits: { type: integer }
        label: { type: string }
        inProcess: { type: boolean }
        reason: { type: string }
    KeyAlgorithmsResponse:
      type: object
      additionalProperties: false
      required: [variants, source, diagnostic]
      properties:
        variants: { type: array, items: { $ref: "#/components/schemas/KeyVariant" } }
        source: { type: string }
        diagnostic: { type: string }
    GenerateKeyRequest:
      type: object
      additionalProperties: false
      required: [algorithm, fileName, comment, passphrase, unencrypted]
      properties:
        algorithm: { type: string, minLength: 1, maxLength: 16 }
        bits: { type: integer }
        fileName: { type: string, minLength: 1, maxLength: 64 }
        group: { type: string, maxLength: 400 }
        comment: { type: string, maxLength: 127 }
        passphrase: { type: string, maxLength: 1024 }
        unencrypted: { type: boolean }
    GenerateKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, publicRelativePath, fingerprint, keyType, bits, encrypted, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        publicRelativePath: { type: string }
        fingerprint: { type: string }
        keyType: { type: string }
        bits: { type: integer }
        encrypted: { type: boolean }
        transactionId: { type: string }
    HardwareCommandRequest:
      type: object
      additionalProperties: false
      required: [algorithm, fileName, comment]
      properties:
        group: { type: string, maxLength: 400 }
        algorithm: { type: string, minLength: 1, maxLength: 16 }
        fileName: { type: string, minLength: 1, maxLength: 64 }
        comment: { type: string, maxLength: 127 }
    HardwareCommandResponse:
      type: object
      additionalProperties: false
      required: [algorithm, command, note]
      properties:
        algorithm: { type: string }
        command: { type: array, items: { type: string } }
        note: { type: string }
    ChangePassphraseRequest:
      type: object
      additionalProperties: false
      required: [currentPassphrase, newPassphrase, unencrypted]
      properties:
        currentPassphrase: { type: string, maxLength: 1024 }
        newPassphrase: { type: string, maxLength: 1024 }
        unencrypted: { type: boolean }
    ChangePassphraseResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, encrypted, notes, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        encrypted: { type: boolean }
        notes: { type: array, items: { type: string } }
        transactionId: { type: string }
    RevealPrivateKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, privateKey, encrypted, fingerprint, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        privateKey: { type: string }
        encrypted: { type: boolean }
        fingerprint: { type: string }
        transactionId: { type: string }
    AliasRequest:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias: { type: string, minLength: 1, maxLength: 255 }
    ExecutableDirective:
      type: object
      additionalProperties: false
      required: [keyword, command, path, line, condition, onEvaluate, onConnect, overridable]
      properties:
        keyword: { type: string }
        command: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        onEvaluate: { type: boolean }
        onConnect: { type: boolean }
        overridable: { type: boolean }
    ConfigCheckResponse:
      type: object
      additionalProperties: false
      required: [root, files, diagnostics]
      properties:
        root: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/ConfigFileSummary" }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/ConfigDiagnostic" }
    ConfigFileSummary:
      type: object
      additionalProperties: false
      required: [path, editable, missing, loads, includes]
      properties:
        path: { type: string }
        editable: { type: boolean }
        missing: { type: boolean }
        loads: { type: integer }
        includes: { type: integer }
    ConfigDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, path, line, detail]
      properties:
        severity: { type: string }
        code: { type: string }
        path: { type: string }
        line: { type: integer }
        detail: { type: string }
    EffectiveResponse:
      type: object
      additionalProperties: false
      required: [alias, evaluated, requiresConfirmation, tokenWarning, executableDirectives, values, sources, complexities, route, failure]
      properties:
        alias: { type: string }
        evaluated: { type: boolean }
        requiresConfirmation: { type: boolean }
        tokenWarning: { type: string }
        executableDirectives:
          type: array
          items: { $ref: "#/components/schemas/ExecutableDirective" }
        values:
          type: array
          items: { $ref: "#/components/schemas/EffectiveValue" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ValueSource" }
        complexities:
          type: array
          items: { $ref: "#/components/schemas/ComplexityNote" }
        route:
          type: array
          items: { $ref: "#/components/schemas/JumpStage" }
        failure: { $ref: "#/components/schemas/OpenSSHFailure" }
    EffectiveValue:
      type: object
      additionalProperties: false
      required: [keyword, values]
      properties:
        keyword: { type: string }
        values:
          type: array
          items: { type: string }
    ValueSource:
      type: object
      additionalProperties: false
      required: [keyword, value, path, line, condition, kind, winner]
      properties:
        keyword: { type: string }
        value: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        kind: { type: string }
        winner: { type: boolean }
    ComplexityNote:
      type: object
      additionalProperties: false
      required: [code, path, line, condition, detail]
      properties:
        code: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        detail: { type: string }
    JumpStage:
      type: object
      additionalProperties: false
      required: [order, depth, parent, hop, hostname, user, port, complex]
      properties:
        order: { type: integer }
        depth: { type: integer }
        parent: { type: string }
        hop: { type: string }
        hostname: { type: string }
        user: { type: string }
        port: { type: string }
        complex: { type: boolean }
    OpenSSHFailure:
      type: object
      additionalProperties: false
      required: [failed, exitCode, stderr, truncated]
      properties:
        failed: { type: boolean }
        exitCode: { type: integer }
        stderr: { type: string }
        truncated: { type: boolean }
    ReachabilityResponse:
      type: object
      additionalProperties: false
      required: [address, outcome, elapsedMs, detail, notice]
      properties:
        address: { type: string }
        outcome: { type: string }
        elapsedMs: { type: integer }
        detail: { type: string }
        notice: { type: string }
    AuthenticationRequest:
      type: object
      additionalProperties: false
      required: [alias, acknowledgeExecutable]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        acknowledgeExecutable: { type: boolean }
    AuthenticationResponse:
      type: object
      additionalProperties: false
      required: [outcome, authenticated, exitCode, stderr, truncated, elapsedMs]
      properties:
        outcome: { type: string }
        authenticated: { type: boolean }
        exitCode: { type: integer }
        stderr: { type: string }
        truncated: { type: boolean }
        elapsedMs: { type: integer }
    RemoteKeyPlanRequest:
      type: object
      additionalProperties: false
      required: [alias, keyPath, publicKey]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        keyPath: { type: string, maxLength: 4096 }
        publicKey: { type: string, minLength: 1, maxLength: 4096 }
    RemoteKeyPlan:
      type: object
      additionalProperties: false
      required: [alias, user, hostname, port, valuesFrom, fingerprint, keyPath, keyLine, remotePath, routine, supported, manual, executableDirectives]
      properties:
        alias: { type: string }
        user: { type: string }
        hostname: { type: string }
        port: { type: string }
        valuesFrom: { type: string }
        fingerprint: { type: string }
        keyPath: { type: string }
        keyLine: { type: string }
        remotePath: { type: string }
        routine: { type: string }
        supported: { type: boolean }
        manual:
          type: array
          items: { type: string }
        executableDirectives:
          type: array
          items: { $ref: "#/components/schemas/ExecutableDirective" }
    RemoteKeyRegisterRequest:
      type: object
      additionalProperties: false
      required: [alias, keyPath, publicKey, acknowledgeExecutable]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        keyPath: { type: string, maxLength: 4096 }
        publicKey: { type: string, minLength: 1, maxLength: 4096 }
        acknowledgeExecutable: { type: boolean }
    RemoteKeyRegisterResponse:
      type: object
      additionalProperties: false
      required: [outcome, exitCode, stderr, truncated]
      properties:
        outcome: { type: string }
        exitCode: { type: integer }
        stderr: { type: string }
        truncated: { type: boolean }
    KnownHostsResponse:
      type: object
      additionalProperties: false
      required: [path, entries]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/KnownHostEntry" }
    KnownHostEntry:
      type: object
      additionalProperties: false
      required: [line, digest, marker, hosts, hashed, keyType, fingerprint, comment]
      properties:
        line: { type: integer }
        digest: { type: string }
        marker: { type: string }
        hosts:
          type: array
          items: { type: string }
        hashed: { type: boolean }
        keyType: { type: string }
        fingerprint: { type: string }
        comment: { type: string }
    KnownHostTarget:
      type: object
      additionalProperties: false
      required: [line, digest]
      properties:
        line: { type: integer }
        digest: { type: string, minLength: 64, maxLength: 64 }
    KnownHostsDeleteRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/KnownHostTarget" }
    KnownHostsChangeResponse:
      type: object
      additionalProperties: false
      required: [changed, transactionId]
      properties:
        changed: { type: boolean }
        transactionId: { type: string }
    KnownHostsScanRequest:
      type: object
      additionalProperties: false
      required: [host, port]
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer }
    KnownHostsScanResponse:
      type: object
      additionalProperties: false
      required: [notice, candidates]
      properties:
        notice: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/KnownHostCandidate" }
    KnownHostCandidate:
      type: object
      additionalProperties: false
      required: [host, port, keyType, key, fingerprint, verified]
      properties:
        host: { type: string }
        port: { type: integer }
        keyType: { type: string }
        key: { type: string }
        fingerprint: { type: string }
        verified: { type: boolean }
    KnownHostsAddRequest:
      type: object
      additionalProperties: false
      required: [host, port, keyType, key, expectedFingerprint, acknowledged]
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer }
        keyType: { type: string, minLength: 1, maxLength: 64 }
        key: { type: string, minLength: 1, maxLength: 4096 }
        expectedFingerprint: { type: string, maxLength: 128 }
        acknowledged: { type: boolean }
    TerminalCommandResponse:
      type: object
      additionalProperties: false
      required: [command, launchable, warning]
      properties:
        command: { type: string }
        launchable: { type: boolean }
        warning: { type: string }
    # Which way this machine is allowed to move data. It governs the writes and
    # nothing else: "push" refuses to apply a snapshot to this disk, "pull"
    # refuses to write one to the bucket. A preview reads and writes nothing, so
    # it stays available either way and a machine that may not apply can still
    # see how far behind it is.
    SyncDirection:
      type: string
      enum: [both, push, pull]
    SyncStatus:
      type: object
      additionalProperties: false
      required: [configured, endpoint, bucket, synced, direction]
      properties:
        configured: { type: boolean }
        # The endpoint and the bucket are shown back so the user can see what
        # this is pointed at. The access key and the secret never are.
        endpoint: { type: string }
        bucket: { type: string }
        synced: { type: boolean }
        direction: { $ref: "#/components/schemas/SyncDirection" }
        lastSyncedAt: { type: string }
        origin: { type: string }
        fileCount: { type: integer }
    SyncSettingsRequest:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, accessKeyId, secretAccessKey]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        bucket: { type: string, minLength: 1, maxLength: 255 }
        region: { type: string, maxLength: 64 }
        accessKeyId: { type: string, minLength: 1, maxLength: 512 }
        secretAccessKey: { type: string, minLength: 1, maxLength: 512 }
        direction: { $ref: "#/components/schemas/SyncDirection" }
    PullRequest:
      type: object
      additionalProperties: false
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 1, maxLength: 1024 }
        # A pull previews by default. Applying is a second, deliberate call
        # with the same passphrase, so the user sees the per-file preview this
        # application shows before every other write.
        apply: { type: boolean }
    SyncConflict:
      type: object
      additionalProperties: false
      required: [path, changedHere, changedThere]
      properties:
        path: { type: string }
        changedHere: { type: boolean }
        changedThere: { type: boolean }
    PullResponse:
      type: object
      additionalProperties: false
      required: [applied, conflicts, written, removed]
      properties:
        applied: { type: boolean }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/SyncConflict" }
        # Paths only. A pull response that carried contents would put a private
        # key in a response body.
        written:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        origin: { type: string }
    PasswordVaultStatus:
      type: object
      additionalProperties: false
      required: [exists, unlocked, aliases]
      properties:
        exists: { type: boolean }
        unlocked: { type: boolean }
        # The hosts that have a stored password. The set of names is not a
        # secret; the values are, and no operation returns one.
        aliases:
          type: array
          items: { type: string }
        minPassphraseLength: { type: integer }
    # Blockers make a stored password unusable, so storing one is refused.
    # Warnings are facts the user may know better about — a configured key that
    # is not authorised on the far side is ordinary — so they are stated and
    # the decision is left where it belongs.
    PasswordEligibility:
      type: object
      additionalProperties: false
      required: [alias, storable, blockers, warnings]
      properties:
