      type: object
      additionalProperties: false
      required: [entry, files, hosts, metadata, diagnostics, notices]
      properties:
        entry: { $ref: "#/components/schemas/FileRef" }
        files: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/HostEntry" } }
        metadata: { $ref: "#/components/schemas/Metadata" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
        pending: { type: array, items: { $ref: "#/components/schemas/PendingTransaction" } }
    FormField:
      type: object
      additionalProperties: false
      required: [line, keyword, values, category, editable]
      properties:
        line: { type: integer }
        keyword: { type: string }
        values: { type: array, items: { type: string } }
        category: { type: string }
        dangerous: { type: boolean }
        duplicate: { type: boolean }
        editable: { type: boolean }
    HostForm:
      type: object
      additionalProperties: false
      required: [entry, fields, raw, comment, commentLines]
      properties:
        entry: { $ref: "#/components/schemas/HostEntry" }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }
        raw: { type: string }
        comment:
          type: string
          description: >-
            The comment lines attached above the Host line, with the '#' markers
            stripped. Empty when the block has none. ssh_config has no trailing
            comment syntax, so only whole lines are ever attached.
        commentLines:
          type: integer
          description: >-
            How many physical lines the attached comment occupies. A client
            rewriting the whole file needs the count to include those lines;
            it cannot be derived from comment, whose markers and indentation
            were stripped.
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
    Source:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        absolute: { type: string }
        line: { type: integer }
        condition: { type: string }
