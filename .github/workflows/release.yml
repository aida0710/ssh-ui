name: Release

# トリガーはタグだけである。ここにあるものはブランチへの push では走らない。
# リリースは意図的な行為であり、バイナリが報告するバージョンは、それがビルド
# された元のタグそのものだからだ。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # 他のあらゆる push と同じゲートである。これを通れないタグは、誰にも
      # インストールできてはならないタグだ。
      - name: Verify
        run: make test

      - name: Build
        run: make build VERSION=${{ github.ref_name }}

      # チェックサムは、手でダウンロードしたものを検証する人のためにある。
      # それが記述する対象の隣に公開されるので、転送の途中切断は捕まえられるが、
      # このリリースが正直かどうかについては何も言わない — README がどちらで
      # あるかを述べており、そうでないかのようにほのめかしてはいない。
      - name: Package
        run: |
          mkdir -p dist
          cp bin/sshc "dist/sshc-darwin-arm64"
          cd dist && shasum -a 256 sshc-darwin-arm64 > checksums.txt

      # 秘密鍵側がこのステップの外へ出ることは決してない。署名を検証できない
      # インストールは、更新を受け取るのではなく拒否する。したがって、これなしで
      # 公開されたリリースは、誰もインストールしないリリースになる。
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/sshc-darwin-arm64 dist/checksums.txt
