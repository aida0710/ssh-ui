name: Release

# A tag is the whole trigger. Nothing here runs on a push to a branch: a
# release is a deliberate act, and the version the binary reports is the tag it
# was built from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # The same gate as every other push. A tag that cannot pass it is a tag
      # nobody should be able to install.
      - name: Verify
        run: make test

      - name: Build
        run: make build VERSION=${{ github.ref_name }}

      # The checksum is for somebody verifying a download they made by hand.
      # It is published beside the thing it describes, so it catches a
      # truncated transfer and says nothing about whether this release is
      # honest — the README says which, rather than implying otherwise.
      - name: Package
        run: |
          mkdir -p dist
          cp bin/ssh-ui "dist/ssh-ui-darwin-arm64"
          cd dist && shasum -a 256 ssh-ui-darwin-arm64 > checksums.txt

      # The private half never leaves this step. An installation that cannot
      # verify the signature refuses the update rather than taking it, so a
      # release published without this one is a release nobody installs.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/ssh-ui-darwin-arm64 dist/checksums.txt
