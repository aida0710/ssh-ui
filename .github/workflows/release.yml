name: Release

# トリガーはタグだけである。ここにあるものはブランチへの push では走らない。
# リリースは意図的な行為であり、バイナリが報告するバージョンは、それがビルド
# された元のタグそのものだからだ。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # 他のあらゆる push と同じゲートである。これを通れないタグは、誰にも
      # インストールできてはならないタグだ。
      - name: Verify
        run: make test

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make build

      # チェックサムは、手でダウンロードしたものを検証する人のためにある。
      # それが記述する対象の隣に公開されるので、転送の途中切断は捕まえられるが、
      # このリリースが正直かどうかについては何も言わない — README がどちらで
      # あるかを述べており、そうでないかのようにほのめかしてはいない。
      - name: Package
        run: |
          mkdir -p dist
          cp bin/sshc "dist/sshc-darwin-arm64"
          cd dist && shasum -a 256 sshc-darwin-arm64 > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/sshc-darwin-arm64 dist/checksums.txt
