name: Release

# トリガーはタグだけである。ここにあるものはブランチへの push では走らない。
# リリースは意図的な行為であり、バイナリが報告するバージョンは、それがビルド
# された元のタグそのものだからだ。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # 他のあらゆる push と同じゲートである。これを通れないタグは、誰にも
      # インストールできてはならないタグだ。
      - name: Verify
        run: make test

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make build

      # チェックサムは、手でダウンロードしたものを検証する人のためにある。
      # それが記述する対象の隣に公開されるので、転送の途中切断は捕まえられるが、
      # このリリースが正直かどうかについては何も言わない — README がどちらで
      # あるかを述べており、そうでないかのようにほのめかしてはいない。
      - name: Package
        run: |
          mkdir -p dist
          cp bin/sshc "dist/sshc-darwin-arm64"
          cd dist && shasum -a 256 sshc-darwin-arm64 > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/sshc-darwin-arm64 dist/checksums.txt
