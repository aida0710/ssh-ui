# 受け入れのゲート。すべての push とすべての pull request で走る。
#
# ジョブは README.md がすでに記載している四つのコマンドであり、赤いチェックが
# 「ビルド」ではなく壊れたものを名指しできるよう分けてある。ここには、ローカルの
# `make test`、`make verify-generated`、`make e2e` より厳しいものは何もない。CI は
# それらが確かに実行されたことを保証する場所であって、二つ目の基準ではない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチへの二度目の push は一度目を置き換える。ランナーを使う価値があるのは
# 先端だけである。`main` を除外してあるのは、その履歴に完全な記録を残すためだ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # このプロジェクトの Go のスタイルは gofmt がすべてである。`gofmt -l` は
      # それと異なるファイルを表示し、ひとつもなければ何も言わない。したがって
      # ファイルの一覧が、失敗そのものであり、その説明でもある。
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted. Run: gofmt -w ." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # race detector を別のステップにしてあるのは、それが遅い方だからであり、
      # またデータ競合は、誤った答えとは別種の失敗だからである。
      - name: go test -race
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci

      # ここに ESLint はない。lint の役目は型検査が担う。アプリケーションと、
      # 自前の tsconfig を持つエンドツーエンドのスイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # このバイナリが askpass ヘルパーそのものなので、ssh が走る前に存在して
      # いなければならない。
      - name: Build the binary
        run: make build

      # このスイートが有用な形では偽装できないサーバーが二つある。本物の S3 実装 —
      # 同期の設計全体が、本物のそれが条件付き PUT に何をするかの上に立っている
      # ため — と、本物の sshd である。askpass ヘルパーが渡したものを OpenSSH が
      # 受け取るかどうかは、スタブに答えられる問いではない。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # クライアントには意図的に CreateBucket がない。アプリケーションが
        # バケットを作らないので、クライアントを広げる代わりにハーネスが行う。
        run: |
          docker exec sshc-s3 sh -c '
            mkdir -p /data/buckets/sshc-test' || true
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null 2>&1 || true

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker logs sshc-s3 2>&1 | tail -50
          docker logs sshc-sshd 2>&1 | tail -50

      - name: Stop the containers
        if: always()
        run: make integration-down

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Build the binary
        run: make build

      # UI はコミット済みのバンドルからバイナリへ埋め込まれる。したがって、
      # ビルドし直されないままの web/src の変更は、クリーンなチェックアウトから
      # ビルドした人へ古いインターフェースを配ることになる。上の `make build` が
      # いま再生成したので、ここに差分があればコミットがそれを忘れたということだ。
      - name: The committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- internal/ui/dist; then
            echo "internal/ui/dist is stale. Run: make build, and commit the result." >&2
            exit 1
          fi

      # Chromium のみ。このスイートはビルド済みのバイナリを localhost 越しに
      # 動かし、それが書くバイト列を表明する。特定のエンジンの描画は見ない。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npm run e2e --prefix web

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: npm audit --prefix web --audit-level=high
